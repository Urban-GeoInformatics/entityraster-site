# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
# The documentation is built from the library's Sphinx sources (user guide, gallery, API reference; every example executed)
# and committed to docs-html/. Read the Docs publishes that build as it is.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - cp -r docs-html/. $READTHEDOCS_OUTPUT/html/
